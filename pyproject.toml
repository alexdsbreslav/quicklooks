[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quicklooks"
version = "2.0.4"
description = "Create presentation-ready data visualizations quickly."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Alex Breslav"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "seaborn",
    "python-dateutil",
]

[project.urls]
Homepage = "https://github.com/alexdsbreslav/quicklooks"

[tool.setuptools.packages.find]
include = ["quicklooks*"]

[tool.setuptools.package-data]
quicklooks = ["fonts/**/*", "skill/**/*"]
